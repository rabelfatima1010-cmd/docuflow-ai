# Full stack: API + worker + Postgres + Redis + frontend + n8n
#   cp backend/.env.example backend/.env   (then edit)
#   docker compose up --build
# UI: http://localhost:3000   API docs: http://localhost:8000/docs   n8n: http://localhost:5678

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: backend/.env
  environment:
    DATABASE_URL: postgresql+psycopg://docuflow:docuflow@db:5432/docuflow
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    deploy:
      replicas: 2

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow
      POSTGRES_DB: docuflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  n8n:
    image: n8nio/n8n:1.95.3
    ports: ["5678:5678"]
    env_file: backend/.env
    environment:
      DOCUFLOW_API_URL: http://api:8000
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes: [n8n:/home/node/.n8n]

volumes:
  pgdata:
  uploads:
  n8n:
